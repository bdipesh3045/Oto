name: oto
description: A personal on-device MP3 library for Android.
publish_to: none
version: 0.2.0+3
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
